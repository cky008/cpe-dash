<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-labelledby="t d"><title id="t">一次会话</title><desc id="d">先看有没有人在用路由器的管理页，没有人才登录一次，读或写，然后马上退出；有人在用就让开，下次再来；无论成功失败都会退出。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="d-box" x="0.0" y="20" width="133.5" height="52" rx="9"/><text class="d-text d-small" x="66.8" y="38" text-anchor="middle" dominant-baseline="central">有人在用吗</text><text class="d-label" x="66.8" y="56" text-anchor="middle" dominant-baseline="central">登录前先问</text><path class="d-arrow" d="M133.5,46.0 L153.5,46.0" marker-end="url(#ah)"/><rect class="d-box" x="155.5" y="20" width="133.5" height="52" rx="9"/><text class="d-text d-small" x="222.2" y="38" text-anchor="middle" dominant-baseline="central">登录一次</text><text class="d-label" x="222.2" y="56" text-anchor="middle" dominant-baseline="central">密码错就停</text><path class="d-arrow" d="M289.0,46.0 L309.0,46.0" marker-end="url(#ah)"/><rect class="d-box" x="311.0" y="20" width="133.5" height="52" rx="9"/><text class="d-text d-small" x="377.8" y="38" text-anchor="middle" dominant-baseline="central">读或写</text><text class="d-label" x="377.8" y="56" text-anchor="middle" dominant-baseline="central">写只发一次</text><path class="d-arrow" d="M444.5,46.0 L464.5,46.0" marker-end="url(#ah)"/><rect class="d-box" x="466.5" y="20" width="133.5" height="52" rx="9"/><text class="d-text d-small" x="533.2" y="38" text-anchor="middle" dominant-baseline="central">退出</text><text class="d-label" x="533.2" y="56" text-anchor="middle" dominant-baseline="central">释放管理员</text><path class="d-arrow" d="M66.8,72 L66.8,98" marker-end="url(#ah)"/><rect class="d-soft" x="0" y="102" width="289.0" height="40" rx="9"/><text class="d-text d-small" x="144.5" y="122" text-anchor="middle" dominant-baseline="central">有人在用：让开，下次再来</text><path class="d-arrow" d="M533.2,72 L533.2,98" marker-end="url(#ah)"/><rect class="d-soft" x="311.0" y="102" width="289.0" height="40" rx="9"/><text class="d-text d-small" x="455.5" y="122" text-anchor="middle" dominant-baseline="central">无论成功失败，都会退出</text></svg>
