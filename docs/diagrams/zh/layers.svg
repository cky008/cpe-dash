<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 542" role="img" aria-labelledby="t d"><title id="t">烽燧的分层</title><desc id="d">从上到下：入口、共用规则、服务、后端、调度器、会话客户端六层不分品牌；品牌驱动和协议部件按品牌接到路由器。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="d-label" x="98" y="31.0" text-anchor="end" dominant-baseline="central">入口</text><rect class="d-box" x="114" y="10" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="31.0" text-anchor="middle" dominant-baseline="central">控制台 · REST API · MCP · Telegram · 自愈</text><path class="d-arrow" d="M357.0,52 L357.0,68" marker-end="url(#ah)"/><text class="d-label" x="98" y="91.0" text-anchor="end" dominant-baseline="central">共用规则</text><rect class="d-box" x="114" y="70" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="91.0" text-anchor="middle" dominant-baseline="central">入参检查 · 写闸门 · 审计日志</text><path class="d-arrow" d="M357.0,112 L357.0,128" marker-end="url(#ah)"/><text class="d-label" x="98" y="151.0" text-anchor="end" dominant-baseline="central">服务</text><rect class="d-box" x="114" y="130" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="151.0" text-anchor="middle" dominant-baseline="central">信号与历史 · 控制 · 短信 · 蜂窝设置 · 告警</text><path class="d-arrow" d="M357.0,172 L357.0,188" marker-end="url(#ah)"/><text class="d-label" x="98" y="211.0" text-anchor="end" dominant-baseline="central">后端</text><rect class="d-box" x="114" y="190" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="211.0" text-anchor="middle" dominant-baseline="central">每项读写一个动词：排队、过闸门、记录</text><path class="d-arrow" d="M357.0,232 L357.0,248" marker-end="url(#ah)"/><text class="d-label" x="98" y="271.0" text-anchor="end" dominant-baseline="central">调度器</text><rect class="d-box" x="114" y="250" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="271.0" text-anchor="middle" dominant-baseline="central">唯一的队列 · 有人在用就让开 · 密码错就停</text><path class="d-arrow" d="M357.0,292 L357.0,308" marker-end="url(#ah)"/><text class="d-label" x="98" y="331.0" text-anchor="end" dominant-baseline="central">会话</text><rect class="d-box" x="114" y="310" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="331.0" text-anchor="middle" dominant-baseline="central">一次一个会话 · 只交一次密码 · 用完就退出</text><path class="d-arrow" d="M357.0,352 L357.0,368" marker-end="url(#ah)"/><text class="d-label" x="98" y="391.0" text-anchor="end" dominant-baseline="central">品牌驱动</text><rect class="d-brand" x="114.0" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="146.1" y="391.0" text-anchor="middle" dominant-baseline="central">华为</text><rect class="d-brand" x="184.3" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="216.4" y="391.0" text-anchor="middle" dominant-baseline="central">中兴</text><rect class="d-brand" x="254.6" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="286.7" y="391.0" text-anchor="middle" dominant-baseline="central">品速</text><rect class="d-brand" x="324.9" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="357.0" y="391.0" text-anchor="middle" dominant-baseline="central">通则康威</text><rect class="d-brand" x="395.1" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="427.3" y="391.0" text-anchor="middle" dominant-baseline="central">烽火</text><rect class="d-brand" x="465.4" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="497.6" y="391.0" text-anchor="middle" dominant-baseline="central">鲲鹏无限</text><rect class="d-brand" x="535.7" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="567.9" y="391.0" text-anchor="middle" dominant-baseline="central">OpenWrt</text><path class="d-arrow" d="M357.0,412 L357.0,428" marker-end="url(#ah)"/><text class="d-label" x="98" y="451.0" text-anchor="end" dominant-baseline="central">协议部件</text><rect class="d-soft" x="114.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="172.5" y="451.0" text-anchor="middle" dominant-baseline="central">HiLink</text><rect class="d-soft" x="237.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="295.5" y="451.0" text-anchor="middle" dominant-baseline="central">ubus</text><rect class="d-soft" x="360.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="418.5" y="451.0" text-anchor="middle" dominant-baseline="central">AT 指令</text><rect class="d-soft" x="483.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="541.5" y="451.0" text-anchor="middle" dominant-baseline="central">各品牌接口</text><path class="d-arrow" d="M357.0,472 L357.0,488" marker-end="url(#ah)"/><text class="d-label" x="98" y="511.0" text-anchor="end" dominant-baseline="central"></text><rect class="d-router" x="114" y="490" width="486" height="42" rx="9"/><text class="d-text d-on-brand" x="357.0" y="511.0" text-anchor="middle" dominant-baseline="central">你的路由器（只连局域网地址）</text></svg>
