<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 542" role="img" aria-labelledby="t d"><title id="t">FengSui's layers</title><desc id="d">Top to bottom: entrances, shared rules, services, backend, scheduler and session client do not depend on the brand; brand drivers and protocol parts connect to the router by brand.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="d-label" x="98" y="31.0" text-anchor="end" dominant-baseline="central">Entrances</text><rect class="d-box" x="114" y="10" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="31.0" text-anchor="middle" dominant-baseline="central">Console · REST API · MCP · Telegram · self-healing</text><path class="d-arrow" d="M357.0,52 L357.0,68" marker-end="url(#ah)"/><text class="d-label" x="98" y="91.0" text-anchor="end" dominant-baseline="central">Shared rules</text><rect class="d-box" x="114" y="70" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="91.0" text-anchor="middle" dominant-baseline="central">Input checks · write gate · audit log</text><path class="d-arrow" d="M357.0,112 L357.0,128" marker-end="url(#ah)"/><text class="d-label" x="98" y="151.0" text-anchor="end" dominant-baseline="central">Services</text><rect class="d-box" x="114" y="130" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="151.0" text-anchor="middle" dominant-baseline="central">Signal and history · controls · SMS · cellular · alerts</text><path class="d-arrow" d="M357.0,172 L357.0,188" marker-end="url(#ah)"/><text class="d-label" x="98" y="211.0" text-anchor="end" dominant-baseline="central">Backend</text><rect class="d-box" x="114" y="190" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="211.0" text-anchor="middle" dominant-baseline="central">One verb per read or write: queue, gate, record</text><path class="d-arrow" d="M357.0,232 L357.0,248" marker-end="url(#ah)"/><text class="d-label" x="98" y="271.0" text-anchor="end" dominant-baseline="central">Scheduler</text><rect class="d-box" x="114" y="250" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="271.0" text-anchor="middle" dominant-baseline="central">One queue · steps aside for you · stops on a bad password</text><path class="d-arrow" d="M357.0,292 L357.0,308" marker-end="url(#ah)"/><text class="d-label" x="98" y="331.0" text-anchor="end" dominant-baseline="central">Session</text><rect class="d-box" x="114" y="310" width="486" height="42" rx="9"/><text class="d-text" x="357.0" y="331.0" text-anchor="middle" dominant-baseline="central">One session at a time · one password try · logs out</text><path class="d-arrow" d="M357.0,352 L357.0,368" marker-end="url(#ah)"/><text class="d-label" x="98" y="391.0" text-anchor="end" dominant-baseline="central">Drivers</text><rect class="d-brand" x="114.0" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="146.1" y="391.0" text-anchor="middle" dominant-baseline="central">Huawei</text><rect class="d-brand" x="184.3" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="216.4" y="391.0" text-anchor="middle" dominant-baseline="central">ZTE</text><rect class="d-brand" x="254.6" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="286.7" y="391.0" text-anchor="middle" dominant-baseline="central">Pinsu</text><rect class="d-brand" x="324.9" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="357.0" y="391.0" text-anchor="middle" dominant-baseline="central">Tozed</text><rect class="d-brand" x="395.1" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="427.3" y="391.0" text-anchor="middle" dominant-baseline="central">FiberHome</text><rect class="d-brand" x="465.4" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="497.6" y="391.0" text-anchor="middle" dominant-baseline="central">NRadio</text><rect class="d-brand" x="535.7" y="370" width="64.3" height="42" rx="9"/><text class="d-text d-small" x="567.9" y="391.0" text-anchor="middle" dominant-baseline="central">OpenWrt</text><path class="d-arrow" d="M357.0,412 L357.0,428" marker-end="url(#ah)"/><text class="d-label" x="98" y="451.0" text-anchor="end" dominant-baseline="central">Protocols</text><rect class="d-soft" x="114.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="172.5" y="451.0" text-anchor="middle" dominant-baseline="central">HiLink</text><rect class="d-soft" x="237.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="295.5" y="451.0" text-anchor="middle" dominant-baseline="central">ubus</text><rect class="d-soft" x="360.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="418.5" y="451.0" text-anchor="middle" dominant-baseline="central">AT commands</text><rect class="d-soft" x="483.0" y="430" width="117.0" height="42" rx="9"/><text class="d-text d-small" x="541.5" y="451.0" text-anchor="middle" dominant-baseline="central">Brand APIs</text><path class="d-arrow" d="M357.0,472 L357.0,488" marker-end="url(#ah)"/><text class="d-label" x="98" y="511.0" text-anchor="end" dominant-baseline="central"></text><rect class="d-router" x="114" y="490" width="486" height="42" rx="9"/><text class="d-text d-on-brand" x="357.0" y="511.0" text-anchor="middle" dominant-baseline="central">Your router (LAN addresses only)</text></svg>
