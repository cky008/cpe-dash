name: 设备兼容性报告 / Device compatibility report
description: 烽燧在你的路由器上能不能用 / How FengSui works with your router
title: "Device report: "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        烽燧目前仅在 **H168-383（固件 4.4.0.1）** 上验证过。其他华为型号和其他品牌的路由器上，烽燧实现了的功能直接可用（写操作默认开着，没有在真机上验证过，可以在「设置 → 设备」逐项关闭），这份报告帮我们了解它在你的路由器上的表现。
        So far FengSui is verified on the **H168-383 (firmware 4.4.0.1)** only. On other Huawei models and routers of other brands, what FengSui implements is available (its writes are on by default, were never checked on a real device, and can be turned off one at a time under Settings → Device); this report tells us how it does on yours.

        **报告怎么来 / Where the report comes from**：控制台「设置 → 设备 → 生成设备报告」，检查后复制，或下载 JSON 文件。 / In the console: Settings → Device → Create device report; check it, then copy it or download the JSON file.

        **之后会怎样 / What happens next**：报告里的 `checks` 逐项列出每个功能在你的路由器上的结果（`works` 能用、`failed` 不能用、`untested` 还没试）。读取项读到了数据、写入项在写入记录里回读一致（`works`），维护者就把它登记进代码，「支持的设备」表里那一格会变成 ✓。 / The report's `checks` list each feature's result on your router (`works`, `failed`, `untested`). A read that had data or a write that read back as written (`works`) is recorded in the code by a maintainer, and its cell on the Supported devices page turns into ✓.
  - type: input
    id: model
    attributes:
      label: 型号 / Model
      description: 「设置 → 设备」里的型号 / The model shown in Settings → Device
      placeholder: B535-232
    validations:
      required: true
  - type: dropdown
    id: brand
    attributes:
      label: 路由器品牌 / Router brand
      description: 「设置 → 路由器」里的品牌（自动识别出来的，或者你选的）/ The brand under Settings → Router (the one FengSui detected, or the one you chose)
      options:
        - 华为 HiLink / Huawei HiLink
        - 中兴 goform / ZTE goform
        - 中兴 zWRT / ZTE zWRT
        - 品速 / Pinsu
        - 通则康威 ZLT / Tozed ZLT
        - 烽火 / FiberHome
        - 鲲鹏无限 / NRadio
        - OpenWrt + 移远或广和通模组 / OpenWrt with a Quectel or Fibocom module
        - 其他品牌（烽燧里还选不到）/ Another brand (not in FengSui yet)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 固件版本 / Firmware
      description: 「设置 → 设备」里的固件 / The firmware shown in Settings → Device
      placeholder: 11.0.1.2(H7SP2C00)
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: 能用的功能 / What works
      description: 可以照抄报告 `checks` 里结果为 `works` 的项；用过写操作的，也写上哪些在路由器上真的生效了（锁频、锁小区、重启、重拨、移动数据、短信）/ You can copy the items of the report's `checks` that say `works`; if you used any of the writes, also say which took effect on the router itself (band lock, cell lock, reboot, redial, mobile data, SMS)
  - type: textarea
    id: broken
    attributes:
      label: 不能用或有问题的 / What does not work
      description: 哪里不对、看到了什么提示（写操作的「回读不一致」也写在这里）/ What looks wrong, and any message you saw (including a write whose read-back differed)
  - type: textarea
    id: router-page
    attributes:
      label: 路由器网页里的选项 / Options on the router's page
      description: 登录路由器自己的管理网页看一看：网络制式能选哪几种、能不能锁 4G / 5G 小区、能不能锁 4G / 5G 频段（看完记得退出登录）。特别写明网页里有、烽燧却拒绝了（附上烽燧给的原因）或没有提供的 / Sign in to the router's own web page and look at which network modes it lets you pick and whether it locks 4G / 5G cells and 4G / 5G bands (sign out when done). Say especially what the page has that FengSui refused (with the reason FengSui gave) or does not offer
  - type: textarea
    id: report
    attributes:
      label: 设备报告 / Device report
      description: 把复制的报告粘贴在 ```json 代码块里，或把下载的 JSON 文件拖进来 / Paste the copied report inside a ```json code block, or drag the downloaded JSON file in
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私 / Privacy
      description: '报告已经脱敏：只有接口结构和少量白名单值（型号、固件、网页版本、开关的小数字、频段号），没有 IMEI、IMSI、MAC、IP 地址、号码、小区或 Wi-Fi 名称。提交前请再看一遍。 / The report is desensitized: endpoint structure and a few allowlisted values (model, firmware and WebUI version, small switch numbers, band numbers), no IMEI, IMSI, MAC, IP address, phone number, cell or Wi-Fi name. Please read it once more before you submit.'
      options:
        - label: 我看过报告，里面没有我的个人信息 / I read the report and it holds nothing personal
          required: true
