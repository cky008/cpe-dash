name: 设备兼容性报告 / Device compatibility report
description: 烽燧在你的路由器上能不能用 / How FengSui works with your router
title: "Device report: "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        烽燧只在 **H168-383（固件 4.4.0.1）** 上验证过。其他华为型号和其他品牌的路由器会以只读方式工作（写操作默认锁定，烽燧能做的写入可以在「设置 → 设备」逐项打开为实验性写入），这份报告帮我们了解它在你的路由器上的表现。
        FengSui is verified on the **H168-383 (firmware 4.4.0.1)** only. Other Huawei models and routers of other brands run read-only (writes are locked by default; those FengSui can do may be turned on one at a time under Settings → Device as experimental writes); this report tells us how it does on yours.

        **报告怎么来 / Where the report comes from**：控制台「设置 → 设备 → 生成设备报告」，检查后复制，或下载 JSON 文件。 / In the console: Settings → Device → Create device report; check it, then copy it or download the JSON file.
  - type: input
    id: model
    attributes:
      label: 型号 / Model
      description: 「设置 → 设备」里的型号 / The model shown in Settings → Device
      placeholder: B535-232
    validations:
      required: true
  - type: dropdown
    id: brand
    attributes:
      label: 路由器品牌 / Router brand
      description: 「设置 → 路由器」里的品牌（自动识别出来的，或者你选的）/ The brand under Settings → Router (the one FengSui detected, or the one you chose)
      options:
        - 华为 HiLink / Huawei HiLink
        - 中兴 goform / ZTE goform
        - 中兴 zWRT / ZTE zWRT
        - 品速 / Pinsu
        - 通则康威 ZLT / Tozed ZLT
        - 烽火 / FiberHome
        - 鲲鹏无限 / NRadio
        - OpenWrt + 移远或广和通模组 / OpenWrt with a Quectel or Fibocom module
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 固件版本 / Firmware
      description: 「设置 → 设备」里的固件 / The firmware shown in Settings → Device
      placeholder: 11.0.1.2(H7SP2C00)
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: 能用的功能 / What works
      description: 例如信号、流量、附近的基站、终端列表、短信；打开过实验性写入的，写上哪些在真机上生效了（锁频、锁小区、重启、重拨、移动数据、短信）/ For example signal, traffic, nearby cells, the device list, SMS; if you turned on experimental writes, which took effect on the real router (band lock, cell lock, reboot, redial, mobile data, SMS)
  - type: textarea
    id: broken
    attributes:
      label: 不能用或有问题的 / What does not work
      description: 哪里不对、看到了什么提示（实验性写入的「回读不一致」也写在这里）/ What looks wrong, and any message you saw (including an experimental write whose read-back differed)
  - type: textarea
    id: report
    attributes:
      label: 设备报告 / Device report
      description: 把复制的报告粘贴在 ```json 代码块里，或把下载的 JSON 文件拖进来 / Paste the copied report inside a ```json code block, or drag the downloaded JSON file in
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私 / Privacy
      description: '报告已经脱敏：只有接口结构和少量白名单值（型号、固件、网页版本、开关的小数字、频段号），没有 IMEI、IMSI、MAC、IP 地址、号码、小区或 Wi-Fi 名称。提交前请再看一遍。 / The report is desensitized: endpoint structure and a few allowlisted values (model, firmware and WebUI version, small switch numbers, band numbers), no IMEI, IMSI, MAC, IP address, phone number, cell or Wi-Fi name. Please read it once more before you submit.'
      options:
        - label: 我看过报告，里面没有我的个人信息 / I read the report and it holds nothing personal
          required: true
