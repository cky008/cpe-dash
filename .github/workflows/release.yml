name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two tags pushed together must not race to publish :latest
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check

  publish:
    name: Build & push linux/amd64 + linux/arm64 to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    # The only job allowed to write: it pushes the image package
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Signed build provenance (which commit and workflow built it) and an SBOM of the image
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: GitHub release notes from CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    # Writes only this tag's release entry
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node --experimental-strip-types scripts/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
          # The annotated tag's subject line ("cpe-dash vX.Y.Z — 烽燧 FengSui: …") is the title
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          title=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message 2>/dev/null | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${title:-cpe-dash $TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "${title:-cpe-dash $TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
