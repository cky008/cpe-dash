name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two tags pushed together must not race to publish :latest
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check

  publish:
    name: Build & push linux/amd64 + linux/arm64 to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    # The only job allowed to write: it pushes the image package and, once the repository is public, attests it
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # GitHub reports the licence as "Other", which would label the image NOASSERTION over the Dockerfile's label
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance (which commit and workflow built it) and an SBOM, attached to the image
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A signed attestation anyone can check: gh attestation verify oci://ghcr.io/<owner>/cpe-dash:<version> -R <owner>/cpe-dash
      # GitHub offers these to public repositories only, so the step waits until this one is public
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  extension:
    name: Claude Desktop extension (.mcpb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    # Builds the extension and, for a tag once the repository is public, attests it; it writes nothing to the repository
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the extension
        id: mcpb
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          npm run build:mcpb
          version="$(node -p 'require("./package.json").version')"
          # A tag releases the version package.json names: v1.2.3 ships fengsui-1.2.3.mcpb
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME does not match package.json's version $version" >&2
            exit 1
          fi
          echo "file=dist/fengsui-$version.mcpb" >> "$GITHUB_OUTPUT"
      # A signed attestation anyone can check: gh attestation verify fengsui-<version>.mcpb -R <owner>/cpe-dash
      - if: ${{ !github.event.repository.private && github.ref_type == 'tag' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.mcpb.outputs.file }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: ${{ steps.mcpb.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  notes:
    name: GitHub release notes from CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    # Writes only this tag's release entry
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: ${{ runner.temp }}/mcpb
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node --experimental-strip-types scripts/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
          # The title is the version alone; the notes open with the highlights
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # The Claude Desktop extension beside the notes (replaced when the release is made again)
          gh release upload "$TAG" "$RUNNER_TEMP"/mcpb/fengsui-*.mcpb --clobber
