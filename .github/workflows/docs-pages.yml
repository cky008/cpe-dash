name: Documentation site

# Builds the home page and the user guide (docs/guide) with scripts/build-docs.ts and publishes them
# to this repository's GitHub Pages. It runs once Pages is set up: set the repository variable
# DOCS_PAGES_ENABLED to "true" (Settings -> Pages -> Source: GitHub Actions first) and DOCS_SITE_URL to
# the site's address, which canonical URLs, hreflang pairs and the sitemap use.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs.ts"
      - "scripts/markdown.ts"
      - "scripts/site-home.ts"
      - "web/site/**"
      - "web/brand/**"
      - "THIRD_PARTY_NOTICES.md"
      - "package.json"
      - ".github/workflows/docs-pages.yml"
  # No release trigger: a release runs on its tag, and the github-pages environment deploys from main only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.repository == 'cky008/cpe-dash' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
          cache: npm
      - name: Install dev toolchain (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: npm run build:docs
      # No configure-pages: it reads the Pages settings (needs pages: read) only to give site generators a
      # base path, and every link in this site is relative
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
